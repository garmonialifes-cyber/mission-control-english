<title>Mission Control English</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --void:#070B18; --hull:#0E1526; --hull2:#141D33; --line:#22304F;
  --ink:#E8EDF7; --ink-dim:#93A2C0; --ink-faint:#5E6E90;
  --amber:#FFB454; --amber-soft:#3A2A12;
  --go:#4ADE80; --go-soft:#10301F;
  --warn:#FBBF24;
  --fail:#F2555A; --fail-soft:#361419;
  --disp:"Chakra Petch",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--body);
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 700px at 78% -12%, #16224080, transparent 60%),
                   radial-gradient(900px 600px at 5% 105%, #1A1330a0, transparent 65%);
  background-attachment:fixed;}
.shell{max-width:920px;margin:0 auto;padding-block:18px 64px;padding-left:18px;padding-right:18px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}

/* ── верхняя телеметрия ── */
.tele{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  border:1px solid var(--line);background:linear-gradient(180deg,var(--hull2),var(--hull));
  padding:9px 12px;margin-bottom:22px}
.tele .sig{width:8px;height:8px;background:var(--go);box-shadow:0 0 10px var(--go);flex:none}
.tele b{font-family:var(--disp);font-weight:700;letter-spacing:.06em;font-size:14px}
.tele .sp{flex:1}
.tele .cell{font-family:var(--mono);font-size:12px;color:var(--ink-dim);white-space:nowrap}
.tele .cell i{font-style:normal;color:var(--amber)}
.tele .link{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:2px 7px;white-space:nowrap}
.tele .link.on{color:var(--go);background:var(--go-soft)}
.tele .link.off{color:var(--ink-faint);background:#151d31}
.tele .tab{background:none;border:1px solid transparent;padding:3px 9px;font-family:var(--mono);
  font-size:12px;color:var(--ink-faint)}
.tele .tab[aria-current="true"]{border-color:var(--line);background:#0b1020;color:var(--ink)}

h1{font-family:var(--disp);font-weight:700;font-size:clamp(28px,6vw,42px);line-height:1.08;
  letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
h2{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:.01em;margin:0 0 12px}
p{margin:0 0 14px;max-width:62ch}
.lead{color:var(--ink-dim);font-size:18px}

.btn{font-family:var(--disp);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  font-size:14px;background:var(--amber);color:#1B1206;border:0;padding:13px 22px}
.btn:hover{background:#FFC776}
.btn.ghost{background:none;color:var(--ink-dim);border:1px solid var(--line);}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink-faint)}

/* ── карта станции ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line)}
.bay{background:var(--hull);padding:14px 14px 14px 16px;position:relative;text-align:left;
  border:0;display:flex;flex-direction:column;gap:5px;min-height:112px;width:100%}
.bay::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink-faint)}
.bay.green::before{background:var(--go);box-shadow:0 0 12px #4ADE8055}
.bay.amber::before{background:var(--warn)}
.bay.red::before{background:var(--fail);box-shadow:0 0 12px #F2555A55}
.bay:hover{background:var(--hull2)}
.bay .ico{font-size:20px;line-height:1}
.bay .nm{font-family:var(--disp);font-weight:600;font-size:17px}
.bay .full{font-size:13px;color:var(--ink-faint);line-height:1.35}
.bay .st{margin-top:auto;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.bay.green .st{color:var(--go)} .bay.amber .st{color:var(--warn)}
.bay.red .st{color:var(--fail)} .bay.unknown .st{color:var(--ink-faint)}
.bay .bar{height:3px;background:#1a2340;margin-top:6px}
.bay .bar span{display:block;height:100%;background:var(--amber)}

/* ── задание ── */
.panel{border:1px solid var(--line);background:var(--hull);padding:20px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.q{font-size:clamp(20px,3.6vw,26px);line-height:1.45;font-weight:600;margin:0 0 20px;
  white-space:pre-wrap;max-width:none}
.q.txt{font-size:17px;font-weight:400;line-height:1.6}
.opts{display:grid;gap:9px}
.opt{text-align:left;background:var(--hull2);border:1px solid var(--line);padding:13px 16px;
  font-size:19px;font-family:var(--body);display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--amber);background:#1b2540}
.opt:disabled{cursor:default;opacity:.55}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--ink-faint);flex:none;width:14px}
.opt.right{border-color:var(--go);background:var(--go-soft);opacity:1}
.opt.wrong{border-color:var(--fail);background:var(--fail-soft);opacity:1}

/* ── разбор ── */
.debrief{border:1px solid var(--line);border-left:4px solid var(--amber);background:#0B1223;
  padding:18px;margin-top:18px;display:grid;gap:14px}
.debrief .row{display:grid;gap:4px}
.debrief .lb{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
.debrief .tx{font-size:17px;line-height:1.55}
.debrief .ex{font-family:var(--mono);font-size:15px;color:var(--go);background:#0a1a12;
  padding:8px 12px;border-left:2px solid var(--go)}
.check{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:2px}
.check input{font-family:var(--mono);font-size:17px;background:#050912;color:var(--ink);
  border:1px solid var(--line);padding:10px 12px;min-width:200px;flex:1}
.check input:focus{border-color:var(--amber);outline:none}
.verdict{font-family:var(--mono);font-size:14px}
.verdict.ok{color:var(--go)} .verdict.no{color:var(--fail)}

/* ── прогресс миссии ── */
.pips{display:flex;gap:4px}
.pips i{width:22px;height:4px;background:#1a2340;display:block}
.pips i.done{background:var(--go)} .pips i.miss{background:var(--fail)} .pips i.now{background:var(--amber)}

/* ── планета ── */
.planet{border:1px solid var(--go);background:linear-gradient(180deg,var(--go-soft),var(--hull));
  padding:24px;text-align:center}
.planet .nm{font-family:var(--disp);font-size:30px;font-weight:700;letter-spacing:.04em;margin:8px 0 12px}
.planet .fact{font-size:17px;line-height:1.6;color:var(--ink);max-width:54ch;margin:0 auto 18px;font-style:italic}

/* ── родительский экран ── */
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:400;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
td{padding:11px 10px 11px 0;border-bottom:1px solid #16203a;vertical-align:middle}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-dim)}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;white-space:nowrap}
.chip.green{color:var(--go);background:var(--go-soft)} .chip.amber{color:var(--warn);background:var(--amber-soft)}
.chip.red{color:var(--fail);background:var(--fail-soft)} .chip.unknown{color:var(--ink-faint);background:#151d31}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:24px}
.stats div{background:var(--hull);padding:14px}
.stats .v{font-family:var(--disp);font-size:28px;font-weight:700;line-height:1;margin-bottom:5px}
.stats .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.foot{margin-top:28px;font-size:13px;color:var(--ink-faint);font-family:var(--mono)}
/* ── демо-режим ── */
.demo-bar{border:1px solid var(--warn);background:#2A2109;padding:11px 14px;margin-bottom:20px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--warn)}
.demo-bar span{flex:1;min-width:180px}
.demo-bar .voice{border-color:#4a3a12;color:var(--warn)}
.demo-bar .voice:hover{border-color:var(--warn)}
.hint{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--go);background:var(--go-soft);padding:3px 7px;flex:none}

/* ── ракета ── */
.rockwrap{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:center;
  border:1px solid var(--line);background:var(--hull);padding:20px;margin-bottom:22px}
.rockwrap svg{width:100%;height:auto;max-width:190px;display:block}
.rockwrap .nfo h2{margin-bottom:6px}
.rockwrap .nfo p{font-size:15px;color:var(--ink-dim);margin-bottom:10px}
.parts{display:flex;flex-wrap:wrap;gap:5px}
.parts span{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 7px;background:#151d31;color:var(--ink-faint)}
.parts span.on{background:var(--amber-soft);color:var(--amber)}
.part{fill:#151F38;stroke:#22304F;stroke-width:2}
.part.on{fill:#1E2B4A;stroke:var(--amber)}
.port{fill:#0A1020;stroke:#22304F;stroke-width:2}
.port.on{fill:var(--go);stroke:var(--go)}
.flame{opacity:0}
@media(max-width:560px){.rockwrap{grid-template-columns:1fr;justify-items:center;text-align:center}
  .rockwrap svg{max-width:150px}.parts{justify-content:center}}
.launch{border:1px solid var(--amber);background:linear-gradient(180deg,#2A1D08,var(--hull));
  padding:28px;text-align:center}
.count{font-family:var(--disp);font-size:clamp(60px,18vw,110px);font-weight:700;line-height:1;
  color:var(--amber);font-variant-numeric:tabular-nums}
@keyframes liftoff{0%{transform:translateY(0)}18%{transform:translateY(8px)}
  100%{transform:translateY(-135vh) scale(.5)}}
@keyframes burn{0%,100%{opacity:.55;transform:scaleY(.8)}50%{opacity:1;transform:scaleY(1.25)}}
.flying svg{animation:liftoff 3.4s cubic-bezier(.5,0,.85,.4) forwards}
.flying .flame{opacity:1;transform-origin:50% 0%;animation:burn .12s infinite}

/* ── голос ── */
.voice{background:none;border:1px solid var(--line);padding:7px 12px;font-family:var(--mono);
  font-size:12px;color:var(--ink-dim);display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.voice:hover{border-color:var(--amber);color:var(--ink)}
.voice.rec{border-color:var(--fail);color:var(--fail)}
.voice.rec::before{content:"";width:8px;height:8px;background:var(--fail);border-radius:50%;
  animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.vrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.heard{font-family:var(--mono);font-size:13px;color:var(--ink-faint);min-height:17px;margin-bottom:10px}
.heard b{color:var(--ink);font-weight:500}

/* ── замок родительской вкладки ── */
.lock{border:1px solid var(--line);background:var(--hull);padding:26px;max-width:430px}
.lock h2{margin-bottom:8px}
.lock p{font-size:15px;color:var(--ink-dim)}
.lock .pinrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.lock input{font-family:var(--mono);font-size:26px;letter-spacing:.42em;background:#050912;color:var(--ink);
  border:1px solid var(--line);padding:11px 14px;width:150px;text-align:center}
.lock input:focus{border-color:var(--amber);outline:none}
.lock .err{color:var(--fail);font-family:var(--mono);font-size:13px;margin-top:10px;min-height:18px}

/* ── грузовой отсек ── */
.bal{border:1px solid var(--amber);background:linear-gradient(180deg,#2A1D08,var(--hull));
  padding:22px 24px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.bal .v{font-family:var(--disp);font-size:clamp(38px,9vw,56px);font-weight:700;line-height:1;
  color:var(--amber);font-variant-numeric:tabular-nums}
.bal .u{font-family:var(--disp);font-size:20px;color:var(--amber);font-weight:600}
.bal .sp{flex:1}
.bal .sub{font-family:var(--mono);font-size:12px;color:var(--ink-dim);text-align:right}
.prizes{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.pz{background:var(--hull);padding:15px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pz .nm{font-size:18px;font-weight:600;flex:1;min-width:160px}
.pz .pr{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;color:var(--amber);white-space:nowrap}
.pz .go{font-family:var(--disp);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:12px;
  background:var(--amber);color:#1B1206;border:0;padding:9px 16px;white-space:nowrap}
.pz .go:disabled{background:none;border:1px solid var(--line);color:var(--ink-faint);cursor:default}
.pz .need{height:3px;background:#1a2340;width:100%;margin-top:-6px}
.pz .need span{display:block;height:100%;background:var(--amber);opacity:.7}
.pz.demo .nm::after{content:"пример";font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);margin-left:9px;vertical-align:middle}
.ord{background:var(--hull);padding:13px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ord .nm{flex:1;min-width:150px}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line)}
.rates div{background:var(--hull);padding:13px 15px}
.rates .v{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--amber);line-height:1.1}
.rates .l{font-size:13px;color:var(--ink-faint);line-height:1.35;margin-top:3px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addrow input{font-family:var(--body);font-size:16px;background:#050912;color:var(--ink);
  border:1px solid var(--line);padding:10px 12px}
.addrow input#pn{flex:1;min-width:180px}
.addrow input#pg{width:110px;font-family:var(--mono)}
.addrow input:focus{border-color:var(--amber);outline:none}
.x{background:none;border:0;color:var(--ink-faint);font-size:18px;line-height:1;padding:4px 8px}
.x:hover{color:var(--fail)}
@media (prefers-reduced-motion:no-preference){
  .flash{animation:fl .45s ease-out}
  @keyframes fl{from{background:#14351f}to{background:var(--hull)}}
}
@media(max-width:480px){.opt{font-size:17px}.tele{font-size:11px}}
</style>

<div class="shell">
  <div class="tele" id="tele"></div>
  <main id="view"></main>
  <div class="foot" id="foot"></div>
</div>

<script src="config.js"></script>
<script src="bank.js"></script>
<script>
const KEY='mce_denis_v1';
const PRIZES0=[
  {id:'p1',n:'Полчаса сверху на планшет',g:300,demo:true},
  {id:'p2',n:'Мороженое на выбор',g:250,demo:true},
  {id:'p3',n:'Поход в планетарий',g:900,demo:true},
  {id:'p4',n:'Набор LEGO про космос',g:3000,demo:true}
];
const blank=()=>({name:'DENIS',started:null,days:[],skills:Object.fromEntries(SKILLS.map(s=>[s.id,
  {status:'unknown',seen:0,first:0,planet:false}])),diag:null,log:[],
  station:null,pin:null,voice:null,mute:false,demo:false,launched:false,coins:0,earned:0,prizes:PRIZES0.slice(),orders:[]});
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r))}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(hasCfg()&&S.station){clearTimeout(SYNC.t);SYNC.t=setTimeout(push,900)}}
const today=()=>new Date().toISOString().slice(0,10);
function markDay(){const d=today();if(!S.days.includes(d))S.days.push(d);save()}
function streak(){let n=0,d=new Date();for(;;){const k=d.toISOString().slice(0,10);
  if(S.days.includes(k)){n++;d.setDate(d.getDate()-1)}else if(n===0&&k===today()){d.setDate(d.getDate()-1)}else break}
  return n}
const norm=t=>t.toLowerCase().trim().replace(/[.!?,]+$/,'').replace(/\s+/g,' ');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const STL={green:'ИСПРАВЕН',amber:'ШАТКО',red:'ПОВРЕЖДЕНИЕ',unknown:'НЕ ПРОВЕРЕН'};
const skill=id=>SKILLS.find(s=>s.id===id);
const RATE={right:10,after:3,mission:25,bay:150,streak:20};
function pay(n){S.coins+=n;S.earned+=n;save();return n}
const V=document.getElementById('view');
let route='home';

/* ─────────── ТЕЛЕМЕТРИЯ ─────────── */
function tele(){
  const t=document.getElementById('tele');
  const ok=SKILLS.filter(s=>S.skills[s.id].status==='green').length;
  t.innerHTML=`<span class="sig"></span><b>MISSION CONTROL</b>
    <span class="cell">СТАЖЁР <i>${S.name}</i></span>
    <span class="cell">ОТСЕКИ <i>${ok}/9</i></span>
    <span class="cell">ДНЕЙ ПОДРЯД <i>${streak()}</i></span>
    <span class="cell">КОИНЫ <i>${S.coins}</i></span>
    <span class="sp"></span>
    ${hasCfg()?`<span class="link ${SYNC.on?'on':'off'}">${SYNC.on?'◉ связь с Землёй':'○ нет связи'}</span>`:''}`;
  if(canSpeak()){
    const vb=document.createElement('button');vb.className='tab';vb.id='mute';
    vb.textContent=S.mute?'🔇 звук выкл':'🔊 звук вкл';vb.title='Читать задания вслух';
    vb.onclick=()=>{S.mute=!S.mute;if(S.mute)try{speechSynthesis.cancel()}catch(e){};save();tele()};
    t.appendChild(vb);
    if(!S.mute){
      const cur=enVoice();
      const nb=document.createElement('button');nb.className='tab';nb.id='nxtv';
      nb.textContent='🗣 '+(cur?cur.name.replace(/\s*\(.*\)/,''):'голос');
      nb.title='Другой голос — нажимайте, пока не понравится';
      nb.onclick=()=>{
        const en=enList();if(!en.length)return;
        const i=cur?en.findIndex(v=>v.name===cur.name):-1;
        const next=en[(i+1)%en.length];
        S.voice=next.name;save();tele();
        speak('Hello! Look, the rocket is taking off right now.');
      };
      t.appendChild(nb);
    }
  }
  [['home','Станция'],['cargo','Грузовой отсек'],['parent','🔒 Для мамы']].forEach(([r,l])=>{
    const b=document.createElement('button');b.className='tab';b.textContent=l;
    b.setAttribute('aria-current',route===r);b.onclick=()=>go(r);t.appendChild(b)});
}
function go(r){stopRec();try{speechSynthesis.cancel()}catch(e){}route=r;render()}
function render(){tele();({home:home,cargo:cargo,parent:parent_,diag:()=>{},mission:()=>{},launch:()=>{}})[route]?.();
  document.getElementById('foot').textContent=S.diag?`Диагностика пройдена ${S.diag}. Прогресс сохраняется в этом браузере.`:'';}





/* ─────────── ДЕМО-РЕЖИМ (посмотреть, как всё устроено) ─────────── */
function fillDemo(full){
  S.demo=true;
  const order=SKILLS.map(s=>s.id);
  order.forEach((id,i)=>{
    const st=S.skills[id];
    const green=full||i<5;
    st.status=green?'green':(i<7?'amber':'red');
    st.seen=full?24:(green?18:8);
    st.first=green?Math.round(st.seen*0.85):Math.round(st.seen*0.45);
    st.planet=green;
  });
  S.diag=new Date().toLocaleDateString('ru-RU');
  S.coins=full?1240:430;S.earned=full?2890:610;
  S.days=[today()];

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canHear=()=>!!SR;
const canSpeak=()=>'speechSynthesis'in window;
let voices=[];
let voicesReady=Promise.resolve();
if(canSpeak()){
  const loadV=()=>{voices=speechSynthesis.getVoices()||[]};
  loadV();
  // список голосов приезжает не сразу — без ожидания браузер берёт голос по умолчанию
  if(!voices.length){
    voicesReady=new Promise(res=>{
      let done=false;
      const fin=()=>{if(done)return;done=true;loadV();res()};
      speechSynthesis.onvoiceschanged=fin;
      const t=setInterval(()=>{loadV();if(voices.length){clearInterval(t);fin()}},120);
      setTimeout(()=>{clearInterval(t);fin()},2500);
    });
  }else speechSynthesis.onvoiceschanged=loadV;
}
// мужские английские голоса по системам: mac, windows, android/chrome
const PREFER=['alex','eddy','daniel','tom','aaron','reed','rocko','arthur','oliver','ryan','guy','david','mark','albert','ralph','fred'];
const MALE=/\b(alex|daniel|aaron|fred|tom|rocko|reed|eddy|arthur|oliver|ryan|guy|david|mark|james|george|rishi|albert|ralph|junior|grandpa|bruce|male)\b/i;
const FEMALE=/\b(samantha|victoria|karen|moira|tessa|fiona|zoe|ava|allison|susan|female|zira|hazel)\b/i;
function enList(){return voices.filter(v=>/^en([-_]|$)/i.test(v.lang))}
function enVoice(){
  const en=enList();
  if(!en.length)return null;
  // раньше мог сохраниться женский голос — он больше не в приоритете
  if(S.voice&&FEMALE.test(S.voice)){S.voice=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  if(S.voice){const pick=en.find(v=>v.name===S.voice);if(pick)return pick}
  const male=en.filter(v=>MALE.test(v.name)&&!FEMALE.test(v.name));
  // сначала по имени из списка предпочтений, улучшенные версии выше
  for(const want of PREFER){
    const hit=male.filter(v=>new RegExp('\\b'+want+'\\b','i').test(v.name));
    if(hit.length)return hit.find(v=>/(enhanced|premium|natural|neural)/i.test(v.name))||hit[0];
  }
  return male[0]||en.find(v=>/^en[-_]US/i.test(v.lang))||en[0]||null;
}
function speak(text,done){
  if(!canSpeak()||S.mute){done&&done();return}
  if(!voices.length){voicesReady.then(()=>realSpeak(text,done));return}
  realSpeak(text,done);
}
function realSpeak(text,done){
  if(!canSpeak()||S.mute){done&&done();return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=enVoice();if(v)u.voice=v;
    u.lang=(v&&v.lang)||'en-US';u.rate=.9;u.pitch=1;
    if(done)u.onend=done;
    speechSynthesis.speak(u);
  }catch(e){done&&done()}
}
// английская часть задания, пропуск читается как "blank"
const sayable=t=>t.split('\n\n')[0].replace(/_{2,}/g,' blank ').replace(/\s+/g,' ').trim();

let REC=null;
function listen(onText,onEnd){
  if(!canHear()){onEnd&&onEnd();return null}
  try{
    const r=new SR();
    r.lang='en-US';r.interimResults=true;r.maxAlternatives=3;r.continuous=false;
    let best='';
    r.onresult=e=>{
      best=Array.from(e.results).map(x=>x[0].transcript).join(' ');
      onText(best,e.results[e.results.length-1].isFinal);
    };
    r.onerror=()=>{onEnd&&onEnd(best)};
    r.onend=()=>{onEnd&&onEnd(best)};
    r.start();return r;
  }catch(e){onEnd&&onEnd('');return null}
}
function stopRec(){try{REC&&REC.stop()}catch(e){}REC=null}
// какой вариант ближе к услышанному
function matchOption(heard,opts){
  const h=' '+norm(heard).replace(/[^a-z0-9 ]/g,'')+' ';
  let best=null,score=0;
  opts.forEach(o=>{
    const n=norm(o).replace(/[^a-z0-9 ]/g,'');
    if(!n)return;
    let sc=0;
    if(h.includes(' '+n+' '))sc=100+n.length;
    else{const w=n.split(' ').filter(x=>x.length>1);
      sc=w.filter(x=>h.includes(' '+x+' ')).length*10}
    if(sc>score){score=sc;best=o}
  });
  return score>=10?best:null;
}

/* ─────────── СВЯЗЬ С ЗЕМЛЁЙ (синхронизация) ─────────── */
const SYNC={on:false,busy:false,dirty:false,last:0};
const hasCfg=()=>typeof CFG!=='undefined'&&CFG.url&&CFG.anon;
const sbHead=()=>({apikey:CFG.anon,Authorization:'Bearer '+CFG.anon,'Content-Type':'application/json'});

async function pull(){
  if(!hasCfg()||!S.station)return false;
  try{
    const r=await fetch(`${CFG.url}/rest/v1/stations?id=eq.${encodeURIComponent(S.station)}&select=data,updated_at`,
      {headers:sbHead()});
    if(!r.ok)throw 0;
    const rows=await r.json();
    SYNC.on=true;
    if(!rows.length)return false;
    const remote=rows[0].data;
    if(remote&&JSON.stringify(remote)!==JSON.stringify(stripLocal(S))){
      const keep={pin:S.pin,station:S.station};
      S=Object.assign(blank(),remote,keep);
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      return true;
    }
    return false;
  }catch(e){SYNC.on=false;return false}
}
function stripLocal(o){const c=JSON.parse(JSON.stringify(o));delete c.pin;delete c.station;return c}

async function push(){
  if(!hasCfg()||!S.station||SYNC.busy)return;
  SYNC.busy=true;
  try{
    const r=await fetch(`${CFG.url}/rest/v1/stations`,{method:'POST',
      headers:Object.assign(sbHead(),{Prefer:'resolution=merge-duplicates'}),
      body:JSON.stringify({id:S.station,data:stripLocal(S),updated_at:new Date().toISOString()})});
    SYNC.on=r.ok;
  }catch(e){SYNC.on=false}
  SYNC.busy=false;
}

function startSync(){
  if(!hasCfg()||!S.station)return;
  pull().then(ch=>{if(ch)render();tele()});
  setInterval(async()=>{
    if(document.hidden)return;
    const ch=await pull();
    if(ch&&(route==='home'||route==='cargo'||route==='parent'))render();
    tele();
  },12000);
}

/* ─────────── ДВИЖОК ЗАДАНИЙ ─────────── */
function runSet(items,opt,done){
  let i=0;const res=[];
  step();
  function step(){
    if(i>=items.length){done(res);return}
    const {sid,q}=items[i];
    const correct=q.o[0];
    const opts=shuffle(q.o);
    const isText=q.q.length>140;
    V.innerHTML=`<div class="panel">
        <div class="qhead">
          <div><div class="eyebrow">${opt.title}</div>
          <div class="mono" style="font-size:12px;color:var(--ink-faint)">${skill(sid).full}</div></div>
          <div class="pips" id="pips"></div>
        </div>
        <div class="q${isText?' txt':''}">${q.q.replace(/</g,'&lt;')}</div>
        <div class="vrow">
          ${canSpeak()?'<button class="voice" id="say">🔊 Прочитать вслух</button>':''}
          ${canHear()?'<button class="voice" id="mic">🎤 Ответить голосом</button>':''}
        </div>
        <div class="heard" id="heard"></div>
        <div class="opts" id="opts"></div>
        <div id="db"></div>
      </div>`;
    const pips=document.getElementById('pips');
    items.forEach((_,k)=>{const el=document.createElement('i');
      el.className=k<i?(res[k].ok?'done':'miss'):k===i?'now':'';pips.appendChild(el)});
    const heard=document.getElementById('heard');
    document.getElementById('say')?.addEventListener('click',()=>speak(sayable(q.q)));
    if(!S.mute&&!isText)setTimeout(()=>speak(sayable(q.q)),380);
    const mic=document.getElementById('mic');
    if(mic)mic.onclick=()=>{
      if(REC){stopRec();mic.classList.remove('rec');mic.textContent='🎤 Ответить голосом';return}
      try{speechSynthesis.cancel()}catch(e){}
      mic.classList.add('rec');mic.textContent='Говори…';
      heard.innerHTML='<span style="color:var(--ink-faint)">слушаю</span>';
      REC=listen(
        (t)=>{heard.innerHTML='слышу: <b>'+t.replace(/</g,'&lt;')+'</b>'},
        (t)=>{
          REC=null;mic.classList.remove('rec');mic.textContent='🎤 Ответить голосом';
          if(!t){heard.innerHTML='<span style="color:var(--ink-faint)">не расслышала — попробуй ещё раз или нажми вариант</span>';return}
          const hit=matchOption(t,opts);
          if(hit){heard.innerHTML='слышу: <b>'+t.replace(/</g,'&lt;')+'</b>';
            const btn=[...box.children].find(b=>b.dataset.v===hit);
            if(btn&&!btn.disabled)btn.click()}
          else heard.innerHTML='слышу: <b>'+t.replace(/</g,'&lt;')+'</b> — такого варианта нет, скажи ещё раз';
        });
    };
    const box=document.getElementById('opts');
    opts.forEach((o,k)=>{const b=document.createElement('button');b.className='opt';
      b.innerHTML=`<span class="k">${'ABCD'[k]}</span><span>${o.replace(/</g,'&lt;')}</span>`+
        (S.demo&&o===correct?'<span class="hint" title="правильный ответ — видно только в показе">верный</span>':'');
      b.dataset.v=o;b.onclick=()=>answer(b,o);box.appendChild(b)});

    function answer(btn,chosen){
      const ok=chosen===correct;
      [...box.children].forEach(b=>b.disabled=true);
      btn.classList.add(ok?'right':'wrong');
      if(!ok)[...box.children].find(b=>b.dataset.v===correct)?.classList.add('right');
      res[i]={sid,ok};
      if(ok){btn.classList.add('flash');
        if(!S.mute&&!isText)speak(sayable(q.q).replace(/ blank /i,' '+correct+' '));
        setTimeout(()=>{i++;step()},760);return}
      debrief();
    }
    function debrief(){
      const d=document.getElementById('db');
      d.className='debrief';
      d.innerHTML=`
        <div class="row"><div class="lb">Что не так</div><div class="tx">${q.why}</div></div>
        <div class="row"><div class="lb">Правило</div><div class="tx">${q.rule}</div></div>
        <div class="row"><div class="lb">Как это звучит</div><div class="ex">${q.ex.replace(/</g,'&lt;')}</div>
          ${canSpeak()?'<div><button class="voice" id="sayex" style="margin-top:6px">🔊 Послушать пример</button></div>':''}</div>
        <div class="row"><div class="lb">Проверим сразу</div><div class="tx">${q.up.q.replace(/</g,'&lt;')}</div>
          <div class="check"><input id="in" autocomplete="off" spellcheck="false" placeholder="напиши ответ">
          <button class="btn" id="ck">Ответить</button></div>
          <div class="verdict" id="vd"></div></div>`;
      const inp=document.getElementById('in'),vd=document.getElementById('vd');
      document.getElementById('sayex')?.addEventListener('click',()=>speak(q.ex));
      if(!S.mute)setTimeout(()=>speak(q.ex),300);
      let tries=0;inp.focus();
      const check=()=>{
        if(norm(inp.value)===norm(q.up.a)){
          vd.className='verdict ok';vd.textContent='✓ Верно. Поехали дальше.';
          document.getElementById('ck').textContent='Дальше';
          document.getElementById('ck').onclick=()=>{i++;step()};
          inp.disabled=true;inp.onkeydown=null;
          document.getElementById('ck').focus();return}
        tries++;
        if(tries===1){vd.className='verdict no';vd.textContent='Не совсем. Посмотри на правило выше и попробуй ещё раз.'}
        else{vd.className='verdict';vd.innerHTML=`<span style="color:var(--amber)">Зайдём с другой стороны:</span>
          <span style="color:var(--ink);font-family:var(--body);font-size:16px">${q.again}</span><br>
          <span style="color:var(--go)">Ответ: ${q.up.a}</span>`;
          document.getElementById('ck').textContent='Понятно, дальше';
          document.getElementById('ck').onclick=()=>{i++;step()}}
      };
      document.getElementById('ck').onclick=check;
      inp.onkeydown=e=>{if(e.key==='Enter')document.getElementById('ck').click()};
    }
  }
}

      <div><div class="v">${RATE.mission}</div><div class="l">за миссию без осечек</div></div>
      <div><div class="v">${RATE.bay}</div><div class="l">за отсек, доведённый до исправного</div></div>
      <div><div class="v">${RATE.streak}</div><div class="l">за каждый день, если занимаешься три дня подряд</div></div>
    </div>`;
  const box=document.getElementById('pz');
  if(!S.prizes.length){box.innerHTML=`<div class="pz"><span class="nm" style="color:var(--ink-faint)">
    Список пока пуст — мама добавит на своей вкладке</span></div>`;return}
  S.prizes.forEach(p=>{
    const can=S.coins>=p.g,pct=Math.min(100,Math.round(S.coins/p.g*100));
    const d=document.createElement('div');d.className='pz'+(p.demo?' demo':'');
    d.innerHTML=`<span class="nm">${esc(p.n)}</span>
      <span class="pr">${p.g} <span style="font-size:13px">коинов</span></span>
      <button class="go"${can?'':' disabled'}>${can?'Заказать':'не хватает '+(p.g-S.coins)}</button>

const esc=t=>String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* ─────────── ЭКРАН ДЛЯ МАМЫ ─────────── */
let unlocked=false;
function parent_(){
  if(!unlocked){lockScreen();return}
  parentScreen();
}
function lockScreen(){
  const first=!S.pin;
  V.innerHTML=`<div class="eyebrow">Закрытый раздел</div>
    <h1>${first?'Придумайте код':'Введите код'}</h1>
    <div class="lock">
      <h2>${first?'Четыре цифры':'Раздел для взрослого'}</h2>
      <p>${first
        ? 'Здесь видно все ошибки Дениса и настраиваются призы. Денису сюда не надо. Придумайте код из четырёх цифр и запишите его — восстановить будет нельзя.'
        : 'Денис, это не твоя вкладка — возвращайся на станцию.'}</p>
      <div class="pinrow">
        <input id="pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="····">
        <button class="btn" id="pgo">${first?'Поставить':'Открыть'}</button>
      </div>
      <div class="err" id="perr"></div>
    </div>`;
  const inp=document.getElementById('pin'),err=document.getElementById('perr');
  inp.focus();
  const act=()=>{
    const v=inp.value.trim();
    if(!/^\d{4}$/.test(v)){err.textContent='Нужно ровно четыре цифры';return}
    if(first){S.pin=v;save();unlocked=true;render();return}
    if(v===S.pin){unlocked=true;render()}
    else{err.textContent='Код не тот';inp.value='';inp.focus()}
  };
  document.getElementById('pgo').onclick=act;
  inp.onkeydown=e=>{if(e.key==='Enter')act()};
}
function parentScreen(){
  const done=SKILLS.filter(s=>S.skills[s.id].status==='green').length;
  const tot=SKILLS.reduce((a,s)=>a+S.skills[s.id].seen,0);
  const fir=SKILLS.reduce((a,s)=>a+S.skills[s.id].first,0);
  const week=S.log.filter(l=>l.d>=new Date(Date.now()-6*864e5).toISOString().slice(0,10));
  V.innerHTML=`<div class="eyebrow">Сводка по навыкам</div>
    <h1>Что у Дениса с английским</h1>
    <p class="lead">Не баллы, а состояние девяти систем языка по американской программе Grade 3–4.
    Красное — то, что нужно чинить; жёлтое — знает, но плавает.</p>
    <div class="stats">
      <div><div class="v" style="color:var(--go)">${done}<span style="color:var(--ink-faint);font-size:16px">/9</span></div><div class="l">Отсеков закрыто</div></div>
      <div><div class="v">${tot?Math.round(fir/tot*100):0}%</div><div class="l">Верно с 1 раза</div></div>
      <div><div class="v">${streak()}</div><div class="l">Дней подряд</div></div>
      <div><div class="v">${week.length}</div><div class="l">Миссий за неделю</div></div>
    </div>
    <table><thead><tr><th>Отсек</th><th>Что это</th><th>Состояние</th><th style="text-align:right">Решено</th><th style="text-align:right">С 1 раза</th></tr></thead>
    <tbody>${SKILLS.map(s=>{const t=S.skills[s.id];return `<tr>
      <td style="font-family:var(--disp);font-weight:600">${s.icon} ${s.name}</td>
      <td style="color:var(--ink-faint);font-size:14px">${s.full}</td>
      <td><span class="chip ${t.status}">${STL[t.status]}</span></td>
      <td class="n" style="text-align:right">${t.seen}</td>
      <td class="n" style="text-align:right">${t.seen?Math.round(t.first/t.seen*100)+'%':'—'}</td>
    </tr>`}).join('')}</tbody></table>
    ${S.log.length?`<h2 style="margin-top:32px">Последние миссии</h2>
    <table><tbody>${S.log.slice(-8).reverse().map(l=>`<tr>
      <td class="n">${l.d.slice(8)}.${l.d.slice(5,7)}</td>
      <td>${skill(l.sid).icon} ${skill(l.sid).name}</td>
      <td class="n" style="text-align:right">${l.c} из ${l.n}</td></tr>`).join('')}</tbody></table>`:''}

    <p style="font-size:15px;color:var(--ink-dim)">Каким голосом приложение читает задания.

    Выберите другой и послушайте кнопкой.</p>
    <div class="addrow" id="vrowp"></div>

    Призы и цены задаёте вы — сотрите примеры и впишите то, что ему правда хочется.</p>

      <input id="pn" placeholder="Что это — например, поход в планетарий" autocomplete="off">
      <input id="pg" placeholder="коины" inputmode="numeric" autocomplete="off">
      <button class="btn" id="padd">Добавить</button>
    </div>
    ${S.orders.filter(o=>!o.done).length?`<h2 style="margin-top:30px">Заказы ждут вас</h2>
      <div class="prizes">${S.orders.filter(o=>!o.done).map(o=>`<div class="ord">
        <span class="nm">${esc(o.n)}</span><span class="mono" style="color:var(--ink-faint);font-size:13px">${o.d}</span>
        <button class="btn" data-give="${o.id}" style="padding:8px 14px;font-size:12px">Выдала</button>

      </div>`).join('')}</div>`:''}
    <p class="foot">Прогресс хранится в этом браузере. <button class="btn ghost" id="lk" style="padding:6px 12px;font-size:12px">Закрыть раздел</button>

  const vr=document.getElementById('vrowp');

    vr.innerHTML='<span style="color:var(--ink-faint);font-size:15px">Этот браузер не умеет читать вслух.</span>';
  }else{
    const sel=document.createElement('select');
    sel.id='vsel';sel.style.cssText='font-family:var(--body);font-size:16px;background:#050912;color:var(--ink);border:1px solid var(--line);padding:10px 12px;flex:1;min-width:200px';

      if(cur&&v.name===cur.name)o.selected=true;sel.appendChild(o)});

    x.onclick=()=>{S.prizes=S.prizes.filter(q=>q.id!==p.id);save();render()};

  document.getElementById('padd').onclick=()=>{
    const n=document.getElementById('pn').value.trim(),g=parseInt(document.getElementById('pg').value,10);
    if(!n||!(g>0)){alert('Напишите название и цену в коинах');return}
    S.prizes.push({id:'p'+Date.now(),n,g});save();render()};
  V.querySelectorAll('[data-give]').forEach(b=>b.onclick=()=>{
    const o=S.orders.find(o=>o.id==b.dataset.give);o.done=true;save();render()});
  V.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{
    const o=S.orders.find(o=>o.id==b.dataset.undo);S.coins+=o.g;
    S.orders=S.orders.filter(x=>x.id!=o.id);save();render()});
  document.getElementById('lk').onclick=()=>{unlocked=false;go('home')};
  document.getElementById('rs').onclick=()=>{if(confirm('Стереть весь прогресс Дениса?')){S=blank();unlocked=false;save();go('home')}};
}
render();
startSync();
</script>
